# Daily College Scorecard data check. See scripts/check-data-updates.ts.
# When the data changed, it commits the record to main, which redeploys the site
# (refreshing the "Data updates" section on /changelog and the static school pages).
name: Check Scorecard data

on:
  schedule:
    - cron: '17 11 * * *' # daily, about 7am Eastern
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only tsx is needed; skipping `npm ci` avoids building native modules.
      - name: Run data check
        run: npx --yes tsx@4 scripts/check-data-updates.ts
        env:
          SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}

      - name: Commit and push if the data changed
        run: |
          git add data/scorecard-fingerprint.json src/data/dataVintages.json src/data/dataUpdates.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data: College Scorecard update recorded $(date -u +%F)"
          git push

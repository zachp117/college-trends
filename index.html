<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Brand: icons + web clip (CollegeTrends brand system v1.0) -->
    <link rel="icon" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#08111f" />

    <!-- Brand: fonts (Space Grotesk = UI/headlines, Space Mono = // labels + data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- meta:start (everything between these markers is swapped out per-route by scripts/generate-sitemap.ts) -->
    <title>College Trends — Federal data on every U.S. college</title>
    <meta
      name="description"
      content="Free, searchable dashboard for the U.S. Department of Education's College Scorecard. Cost, earnings, debt, completion, demographics, and more — for every U.S. college."
    />
    <link rel="canonical" href="https://www.collegetrends.io/" />

    <!-- Open Graph (link previews on iMessage, Slack, LinkedIn, Discord, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="College Trends" />
    <meta property="og:title" content="College Trends — Federal data on every U.S. college" />
    <meta
      property="og:description"
      content="Free, searchable dashboard for the U.S. Department of Education's College Scorecard. Cost, earnings, debt, completion, demographics — for every U.S. college."
    />
    <meta property="og:url" content="https://www.collegetrends.io/" />
    <meta property="og:image" content="https://www.collegetrends.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="College Trends — Federal data on every U.S. college" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="College Trends — Federal data on every U.S. college" />
    <meta
      name="twitter:description"
      content="Free, searchable dashboard for the U.S. Department of Education's College Scorecard."
    />
    <meta name="twitter:image" content="https://www.collegetrends.io/og-image.png" />
    <!-- meta:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
